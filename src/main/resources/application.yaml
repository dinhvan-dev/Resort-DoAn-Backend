server:
  port: 8080
  servlet:
    context-path: /resort

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/resort
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  cache:
    type: simple
    cache-names:
      - rooms
      - room
      - customers
      - customer
      - bookings
      - booking

  jpa:
    hibernate:
      ddl-auto: validate
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    validate-on-migrate: false
    repair-on-migrate: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 55MB

jwt:
  signerKey: "V*J);v%b5BOsDfccqfAknb<ga!f43IIB+4L>tt}bDQqmO5N5wb8:l4VlmsMTs95*}KJI@7_3)gga8;9{;sH+k39pI9gO1rQ7YbNiomO]KMQm7mK<V{KULl9o@@ke+7(d"

resilience4j:
  circuitbreaker:
    instances:
      databaseService:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        slow-call-duration-threshold: 3s
        slow-call-rate-threshold: 50

  retry:
    instances:
      databaseService:
        max-attempts: 3
        wait-duration: 500ms
        retry-exceptions:
          - org.springframework.dao.TransientDataAccessException
          - java.net.ConnectException

app:
  admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:Admin1234}
  upload:
    room-image-dir: uploads/rooms

vnpay:
  tmn-code: ${VNPAY_TMN_CODE:DEMO1234}
  hash-secret: ${VNPAY_HASH_SECRET:DEMOSECRETKEY}
  payment-url: https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
  return-url: ${VNPAY_RETURN_URL:http://localhost:3000/app/payment-result}
  api-url: https://sandbox.vnpayment.vn/merchant_webapi/api/transaction
